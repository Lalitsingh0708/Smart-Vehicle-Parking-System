<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <!-- Deep Pine & Forest Green Linear Gradient -->
    <linearGradient id="logo-bg" x1="2" y1="2" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#176B5B"/>
      <stop offset="1" stop-color="#0E3D34"/>
    </linearGradient>

    <!-- Champagne Metallic Gold Gradient -->
    <linearGradient id="logo-gold" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5D77F"/>
      <stop offset="0.45" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#A0791C"/>
    </linearGradient>

    <!-- North-East Navigation Compass Pointer Gradient -->
    <linearGradient id="logo-needle" x1="30" y1="8" x2="42" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF2B2"/>
      <stop offset="0.5" stop-color="#E5C158"/>
      <stop offset="1" stop-color="#B38722"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="logo-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" floodColor="#0E3D34" floodOpacity="0.25"/>
    </filter>
  </defs>

  <!-- Left: Architectural Emblem (48x48 centered at y=8) -->
  <g transform="translate(8, 8)">
    <!-- Base Plaque -->
    <rect width="48" height="48" rx="13" fill="url(#logo-bg)" filter="url(#logo-shadow)"/>

    <!-- Champagne Gold Precision Rim -->
    <rect x="1" y="1" width="46" height="46" rx="12" stroke="url(#logo-gold)" stroke-width="1.5" stroke-opacity="0.9"/>

    <!-- Subtle Inner Inset Border -->
    <rect x="4" y="4" width="40" height="40" rx="9" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="0.8"/>

    <!-- Vertical Mast of the Parking 'P' -->
    <rect x="13" y="11.5" width="5" height="25" rx="2.5" fill="#FFFFFF"/>

    <!-- Sculpted Head of 'P' -->
    <path d="M15 11.5H25C29.8626 11.5 33.8 15.4374 33.8 20.3C33.8 25.1626 29.8626 29.1 25 29.1H15V11.5Z" fill="#FFFFFF"/>
    <path d="M18 15.9H24.5C26.93 15.9 28.9 17.87 28.9 20.3C28.9 22.73 26.93 24.7 24.5 24.7H18V15.9Z" fill="#176B5B"/>

    <!-- Inner Radar Target / Parking Slot Beacon -->
    <circle cx="23" cy="20.3" r="2.4" fill="url(#logo-gold)"/>
    <circle cx="23" cy="20.3" r="3.9" stroke="url(#logo-gold)" stroke-width="0.8" stroke-opacity="0.6" stroke-dasharray="1.5 1.5"/>

    <!-- North-East Compass Locator Pointer -->
    <path d="M35.5 9L30 14.5L31.6 16.1L37.1 10.6L38.7 12.2V6.8H33.3L35.5 9Z" fill="url(#logo-needle)"/>

    <!-- Base Anchor Dot -->
    <circle cx="15.5" cy="36.5" r="1.3" fill="url(#logo-gold)"/>
  </g>

  <!-- Right: Refined Wordmark Typography -->
  <g transform="translate(68, 12)">
    <!-- Main Title -->
    <text x="0" y="24" font-family="'Inter', -apple-system, sans-serif" font-size="18.5" font-weight="900" letter-spacing="-0.02em" fill="#1C1815">
      Where Did I <tspan fill="#176B5B">Park</tspan><tspan fill="#B08528">?</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.22em" fill="#B08528">
      TWO-WHEELER PARKING MANAGEMENT
    </text>
  </g>
</svg>

